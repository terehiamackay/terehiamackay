<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      font-family: system-ui, sans-serif;
      color: #dbe4ff;
    }
    .wrap { text-align: center; }
    canvas {
      border: 2px solid #dbe4ff;
      background: #05070f;
      max-width: calc(100vw - 2rem);
      height: auto;
    }
    p { margin: 0.75rem 0 0; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <canvas id="pong" width="800" height="480" aria-label="Pong game"></canvas>
    <p>Controls: W/S or ↑/↓ to move your paddle.</p>
  </main>
  <script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext("2d");

    const paddleWidth = 14;
    const paddleHeight = 96;
    const paddleSpeed = 6;
    const ballSize = 12;
    const aiSpeed = 4.4;

    const player = {
      x: 20,
      y: (canvas.height - paddleHeight) / 2,
      score: 0
    };

    const ai = {
      x: canvas.width - 20 - paddleWidth,
      y: (canvas.height - paddleHeight) / 2,
      score: 0
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 5,
      vy: 3
    };

    const keys = new Set();
    window.addEventListener("keydown", (event) => keys.add(event.key.toLowerCase()));
    window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = direction * 5;
      ball.vy = (Math.random() * 4) - 2;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function update() {
      if (keys.has("w") || keys.has("arrowup")) {
        player.y -= paddleSpeed;
      }
      if (keys.has("s") || keys.has("arrowdown")) {
        player.y += paddleSpeed;
      }
      player.y = clamp(player.y, 0, canvas.height - paddleHeight);

      const aiCenter = ai.y + paddleHeight / 2;
      const move = ball.y - aiCenter;
      ai.y += clamp(move, -aiSpeed, aiSpeed);
      ai.y = clamp(ai.y, 0, canvas.height - paddleHeight);

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y <= ballSize / 2 || ball.y >= canvas.height - ballSize / 2) {
        ball.vy *= -1;
      }

      const playerHit =
        ball.x - ballSize / 2 <= player.x + paddleWidth &&
        ball.y >= player.y &&
        ball.y <= player.y + paddleHeight &&
        ball.vx < 0;

      const aiHit =
        ball.x + ballSize / 2 >= ai.x &&
        ball.y >= ai.y &&
        ball.y <= ai.y + paddleHeight &&
        ball.vx > 0;

      if (playerHit || aiHit) {
        const paddle = playerHit ? player : ai;
        const paddleCenter = paddle.y + paddleHeight / 2;
        const offset = (ball.y - paddleCenter) / (paddleHeight / 2);
        ball.vx *= -1.05;
        ball.vy += offset * 2;
      }

      if (ball.x < 0) {
        ai.score += 1;
        resetBall(1);
      } else if (ball.x > canvas.width) {
        player.score += 1;
        resetBall(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#dbe4ff";
      ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);
      ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ballSize / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#7f8db3";
      for (let y = 10; y < canvas.height; y += 24) {
        ctx.fillRect(canvas.width / 2 - 2, y, 4, 14);
      }

      ctx.fillStyle = "#dbe4ff";
      ctx.font = "bold 38px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${player.score} : ${ai.score}`, canvas.width / 2, 48);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    draw();
    loop();
  </script>
</body>
</html>
